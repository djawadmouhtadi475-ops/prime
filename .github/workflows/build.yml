name: Build Prime Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # لتفعيل لينكس/ماك: احذف runs-on أعلاه وفعّل المصفوفة التالية
    # strategy:
    #   matrix:
    #     os: [windows-latest, ubuntu-latest, macos-latest]
    # runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Create keys.json
        shell: bash
        run: |
          printf '{"MICROSOFT_CLIENT_ID":"%s","CURSEFORGE_API_KEY":"%s"}' "${{ secrets.MICROSOFT_CLIENT_ID }}" "${{ secrets.CURSEFORGE_API_KEY }}" > keys.json

      - name: Build
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: PrimeLauncher-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
