name: Build Prime Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
            artifact: PrimeLauncher-windows
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage deb
            artifact: PrimeLauncher-linux
          - name: macOS
            os: macos-latest
            args: --mac dmg zip
            artifact: PrimeLauncher-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Create macOS icon (.icns)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p assets/PrimeLauncher.iconset
          sips -z 16 16 assets/icon.png --out assets/PrimeLauncher.iconset/icon_16x16.png
          sips -z 32 32 assets/icon.png --out assets/PrimeLauncher.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/icon.png --out assets/PrimeLauncher.iconset/icon_32x32.png
          sips -z 64 64 assets/icon.png --out assets/PrimeLauncher.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/icon.png --out assets/PrimeLauncher.iconset/icon_128x128.png
          sips -z 256 256 assets/icon.png --out assets/PrimeLauncher.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/icon.png --out assets/PrimeLauncher.iconset/icon_256x256.png
          sips -z 512 512 assets/icon.png --out assets/PrimeLauncher.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/icon.png --out assets/PrimeLauncher.iconset/icon_512x512.png
          sips -z 1024 1024 assets/icon.png --out assets/PrimeLauncher.iconset/icon_512x512@2x.png
          iconutil -c icns assets/PrimeLauncher.iconset -o assets/icon.icns

      - name: Create keys.json
        shell: bash
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          node -e "require('fs').writeFileSync('keys.json', JSON.stringify({MICROSOFT_CLIENT_ID: process.env.MICROSOFT_CLIENT_ID || '', CURSEFORGE_API_KEY: process.env.CURSEFORGE_API_KEY || ''}))"

      - name: Build
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
